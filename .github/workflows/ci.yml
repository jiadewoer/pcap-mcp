name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Pytest
        run: pytest -v --cov=src --cov-report=term-missing -m "not integration"

      - name: Mypy
        run: mypy src scripts/openai_mcp_client.py

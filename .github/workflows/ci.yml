name: Regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked development dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - name: Core checks without parser integration
        run: uv run --locked --extra dev python -X utf8 -B -m pytest -q tests -m "not integration"

  parser-and-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Wireshark command-line tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark wireshark-common
      - name: Install locked development dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - name: Core checks with parser integration
        run: uv run --locked --extra dev python -X utf8 -B -m pytest -q tests
      - name: Daily entry checks with simulated model responses
        run: uv run --locked --extra dev python -X utf8 -B -m pytest -q pcap-final-v1/test_final.py

[project]
name = "pcap-mcp"
version = "0.1.0"
description = "Secure MCP server for network packet capture analysis with tshark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pcap-mcp contributors" }]
dependencies = [
    "mcp>=1.2,<2",
    "openai>=1.50,<3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "scapy>=2.5",
]

[project.scripts]
pcap-mcp = "pcap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcap_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a local Wireshark/tshark installation"]

[tool.coverage.run]
source = ["pcap_mcp"]

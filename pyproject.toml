[project]
name = "pcap-mcp"
version = "0.8.0"
description = "Secure MCP server for network packet capture analysis with tshark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jiadewoer" }]
dependencies = [
    "mcp>=1.2,<2",
    "pydantic>=2.6",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
client = ["openai>=1.50,<3"]
dev = [
    "openai>=1.50,<3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pcap-mcp = "pcap_mcp.server:main"
pcap-mcp-agent = "pcap_mcp.agent:main"
pcap-mcp-baseline = "pcap_mcp.baseline:main"
pcap-mcp-verify = "pcap_mcp.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcap_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a local Wireshark/tshark installation"]

[tool.coverage.run]
source = ["pcap_mcp"]
